name = "born-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
port = 8000

# Environment variables from .dev.vars are automatically loaded

# Default D1 Database bindings (for production)
[[d1_databases]]
binding = "DB"
database_name = "born-db"
database_id = "e9fc0460-9d98-4beb-a516-e78ee8ebcfe9"
migrations_dir = "db/migrations"

# Development environment
[env.development]
[[env.development.d1_databases]]
binding = "DB"
database_name = "born-db-local"
database_id = "local"
migrations_dir = "db/migrations"

[[env.development.r2_buckets]]
binding = "STORAGE"
bucket_name = "born-storage-dev"

[env.development.vars]
STORAGE_URL = "https://storage-dev.bebeji-nappa.com"

# Staging environment
[env.staging]
name = "born-api-staging"

# D1 Database bindings for staging
[[env.staging.d1_databases]]
binding = "DB"
database_name = "born-db-staging"
database_id = "43ca1a97-455b-4ff1-9cec-002ab5b17492"
migrations_dir = "db/migrations"

[[env.staging.r2_buckets]]
binding = "STORAGE"
bucket_name = "born-storage-staging"

# Environment variables (set via Dashboard or wrangler secret)
[env.staging.vars]
AUTH_GITHUB_ID = { binding = "AUTH_GITHUB_ID" }
AUTH_GITHUB_SECRET = { binding = "AUTH_GITHUB_SECRET" }
API_BASE_URL = { binding = "API_BASE_URL" }
FRONTEND_URL = { binding = "FRONTEND_URL" }
ALLOW_EMAIL = { binding = "ALLOW_EMAIL" }
NODE_ENV = "staging"
STORAGE_URL = "https://staging-storage.born-docs.com"

# Production environment
[env.production]
name = "born-api"

# D1 Database bindings for production
[[env.production.d1_databases]]
binding = "DB"
database_name = "born-db"
database_id = "e9fc0460-9d98-4beb-a516-e78ee8ebcfe9"
migrations_dir = "db/migrations"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "born-storage"

# Environment variables (set via Dashboard or wrangler secret)
[env.production.vars]
AUTH_GITHUB_ID = { binding = "AUTH_GITHUB_ID" }
AUTH_GITHUB_SECRET = { binding = "AUTH_GITHUB_SECRET" }
API_BASE_URL = { binding = "API_BASE_URL" }
FRONTEND_URL = { binding = "FRONTEND_URL" }
ALLOW_EMAIL = { binding = "ALLOW_EMAIL" }
NODE_ENV = "production"
STORAGE_URL = "https://storage.bebeji-nappa.com"

[observability.logs]
enabled = true

[[routes]]
pattern = "api.bebeji-nappa.com"
custom_domain = true

[[env.staging.routes]]
pattern = "staging-api.born-docs.com"
custom_domain = true
