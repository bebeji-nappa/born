name = "born-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
port = 8000

# Environment variables from .dev.vars are automatically loaded

# Production environment
[env.production]
name = "born-api-prod"

[observability.logs]
enabled = true

[[routes]]
pattern = "api.bebeji-nappa.com"
custom_domain = true
